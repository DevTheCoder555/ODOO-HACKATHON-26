version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: brightloop-db
    environment:
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: brightloop_password
      POSTGRES_DB: brightloop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightloop -d brightloop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: brightloop-backend
    environment:
      DATABASE_URL: postgresql://brightloop:brightloop_password@db:5432/brightloop_db
      SECRET_KEY: brightloop-super-secure-production-ready-jwt-secret-key-2026
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: brightloop-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:

